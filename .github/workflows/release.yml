name: Build Desktop

on:
  push:
    branches:
      - "desktop/**"
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      prepare_draft:
        description: "Preparar release em rascunho (somente após homologação)"
        type: boolean
        default: false

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Test desktop
        run: npm test
      - name: Build Windows installer without publication
        run: npm run dist:win
      - name: Validate update assets
        run: npm run verify:update
      - name: Save installer for homologation
        uses: actions/upload-artifact@v4
        with:
          name: prestativa-office-windows-${{ github.sha }}
          if-no-files-found: error
          path: |
            desktop/dist/*.exe
            desktop/dist/*.blockmap
            desktop/dist/latest.yml
      - name: Read package version
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "Invalid version" }
          if ("${{ github.ref_type }}" -eq "tag" -and "${{ github.ref_name }}" -ne "v$version") {
            throw "Tag and desktop version must match"
          }
          "tag=v$version" >> $env:GITHUB_OUTPUT
    outputs:
      tag: ${{ steps.version.outputs.tag }}

  draft:
    if: github.event_name == 'workflow_dispatch' && inputs.prepare_draft
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: prestativa-office-windows-${{ github.sha }}
          path: installers
      - name: Refuse to replace an existing release or tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
        run: |
          gh api "repos/$GH_REPO/releases?per_page=100" > /tmp/releases.json
          if jq -e --arg tag "$RELEASE_TAG" 'any(.[]; .tag_name == $tag)' /tmp/releases.json >/dev/null; then
            echo "Release already exists; refusing replacement"
            exit 1
          fi
          gh api "repos/$GH_REPO/git/matching-refs/tags/$RELEASE_TAG" > /tmp/tags.json
          if jq -e --arg ref "refs/tags/$RELEASE_TAG" 'any(.[]; .ref == $ref)' /tmp/tags.json >/dev/null; then
            echo "Tag already exists; refusing replacement"
            exit 1
          fi
      - name: Create draft only; publication requires explicit authorization
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Virtual Office ${{ needs.build.outputs.tag }}
          draft: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            installers/*.exe
            installers/*.blockmap
            installers/latest.yml

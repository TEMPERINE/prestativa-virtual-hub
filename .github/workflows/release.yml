name: Release Desktop

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Versão para gerar/publicar (ex: v1.0.6)"
        required: true
        default: "v1.0.6"

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.repository.default_branch || github.ref }}
          fetch-depth: 0

      - name: Prepare release version
        shell: pwsh
        working-directory: .
        run: |
          $tag = "${{ env.RELEASE_TAG }}"
          if ($tag -notmatch '^v\d+\.\d+\.\d+$') {
            throw "Use uma versão no formato v1.0.6"
          }

          $version = $tag.TrimStart('v')
          npm version $version --prefix desktop --no-git-tag-version --allow-same-version

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch --tags origin
          if (git rev-parse "$tag" 2>$null) {
            Write-Host "Tag $tag já existe. Vou anexar/atualizar os arquivos nessa release."
          } else {
            git tag -a $tag -m "Release $tag"
            git push origin $tag
          }

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build and publish Windows installer
        run: npm run dist:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: List build output
        shell: pwsh
        run: |
          Write-Host "=== dist contents (cwd=desktop) ==="
          if (Test-Path dist) { Get-ChildItem -Path dist -Recurse | Select-Object FullName, Length } else { Write-Host "dist/ does not exist" }

      - name: Check installer exists
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path dist -Filter *.exe -File -ErrorAction SilentlyContinue
          if (-not $exe) {
            throw "O instalador .exe não foi gerado em desktop/dist. Veja o passo 'Build and publish Windows installer'."
          }
          $exe | Select-Object Name, Length

      - name: Attach installer to GitHub release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Virtual Office ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            desktop/dist/*.exe
            desktop/dist/*.blockmap
            desktop/dist/latest.yml
